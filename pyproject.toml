[project]
name = "multi-tenant-locker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.17.2",
    "djangorestframework-simplejwt>=5.5.1",
    "phonenumbers>=9.0.41",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

[tool.ruff]
extend-exclude = ["*/migrations/*"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra --strict-markers"
markers = [
    "concurrency: tests that use real parallel database connections",
    "redis: tests that talk to a real Redis server",
]
